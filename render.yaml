services:
  - type: web
    name: hackathon-game-backend
    env: node
    buildCommand: npm install && npm run build:backend
    startCommand: npm run dev:backend # In production, this should ideally be node dist/server.js, but since it uses tsx watch, we can stick to dev for now or change to tsx server.ts
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: hackathon-game-frontend
    env: node
    buildCommand: npm install && npm run build:frontend
    startCommand: npm run start --workspace=frontend
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: hackathon-game-backend
          envVarKey: RENDER_EXTERNAL_URL
